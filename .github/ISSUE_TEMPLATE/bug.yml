name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a .txt file
        2. Press Tab on the second line
        3. …
  - type: input
    id: version
    attributes:
      label: Version of Cascades
      description: File > Check for updates… shows it.
      placeholder: 0.6.1
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, the file that shows the problem, your settings.json…
