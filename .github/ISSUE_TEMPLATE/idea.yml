name: Idea
description: A feature or a change you would like.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The need first, then how Cascades could help. Keep in mind that Cascades is a notepad, not a code editor.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Shortcut, menu, setting… Could it be a plugin?
