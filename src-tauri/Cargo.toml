[package]
name = "cascades"
version = "0.6.1"
description = "A fast, customizable text editor for notes"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cascades_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "8.2.0"
tauri-plugin-opener = "2.6.0"
trash = "5.2.9"
ignore = "0.4.33"
regex = "1.13.1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_System_Com", "Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
