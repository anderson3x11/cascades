[package]
name = "cascades"
version = "0.1.0"
description = "A fast, customizable text editor for notes"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cascades_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
