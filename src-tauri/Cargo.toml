[package]
name = "cascades"
version = "0.1.0"
description = "A fast, customizable text editor for notes"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cascades_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "8.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
